[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
version = 1.4.1

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  pre:scripts/patch_epd47.py
  post:scripts/register_unit_tests_target.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3

; Xteink X3/X4 device layer (ESP32-C3): both siblings compile into one binary
; and are runtime-selected via the X3 hardware fingerprint.
[xteink]
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1

[env:default]
extends = base
build_flags =
  ${xteink.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes branch + short SHA)
  -DENABLE_SERIAL_LOG
  -DENABLE_SERIAL_TRANSPORT
  -DLOG_LEVEL=2 ; Set log level to debug for development builds


[env:gh_release]
extends = base
build_flags =
  ${xteink.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DENABLE_SERIAL_TRANSPORT
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base
build_flags =
  ${xteink.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DENABLE_SERIAL_TRANSPORT
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base
build_flags =
  ${xteink.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG

; LilyGo T5 ePaper 4.7 S3 v2.4 (non-Pro "EPD47") — ESP32-S3-WROOM-1-N16R8.
; The panel is driven through the vendor LilyGo-EPD47 library (GPL-3.0, linked
; in this env only — see freeink-sdk/docs/lilygo-t5-epd47-v24.md); its 4-bpp
; staging frame lives in PSRAM (OPI, memory_type qio_opi).
[lilygo]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
; Note: no custom_sdkconfig here on purpose — a hybrid IDF rebuild (tried for
; PM/light-sleep and PSRAM leakage workarounds) adds build time and complexity,
; and the vendor demo reaches ~0.4 mA deep sleep on the stock prebuilt libs.
build_flags =
  ${base.build_flags}
  -DBOARD_HAS_PSRAM
  -DFREEINK_DEVICE_LILYGO_EPD47=1
  -DFREEINK_CAP_RTC=1
  ; LilyGo-EPD47 tests ESP_IDF_VERSION_MAJOR before including anything that
  ; defines it (rmt_pulse.c), picking the legacy RMT include but the IDF5 code.
  ; Pre-including the version header makes its guards see the real IDF version.
  -include esp_idf_version.h
  ; The concrete LilyGo environments below add their own version and log level.
lib_deps =
  ${base.lib_deps}
  h2zero/NimBLE-Arduino @ 2.3.8
  https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#77387e337483be92186dee1e5ac6ad1d193ae16a

[env:lilygo]
extends = lilygo
build_flags =
  ${lilygo.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-lilygo-dev\"
  -DENABLE_SERIAL_LOG
  -DENABLE_SERIAL_TRANSPORT
  -DLOG_LEVEL=2 ; Set log level to debug for development builds

[env:lilygo_release]
extends = lilygo
build_flags =
  ${lilygo.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-bizreader\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1

[env:lilygo_release_rc]
extends = lilygo
build_flags =
  ${lilygo.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-bizreader-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DENABLE_SERIAL_TRANSPORT
  -DLOG_LEVEL=1

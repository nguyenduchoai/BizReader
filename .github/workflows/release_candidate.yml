name: Compile BizReader LilyGo Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-bizreader-lilygo-release-candidate:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Extract revision
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build BizReader LilyGo Release Candidate
        env:
          CROSSPOINT_RC_HASH: ${{ env.SHORT_SHA }}
        run: pio run -e lilygo_release_rc

      - name: Package Corresponding Source
        env:
          PIO_ENV: lilygo_release_rc
          SOURCE_ARCHIVE: BizReader-LilyGo-RC-${{ env.SHORT_SHA }}-source.tar.gz
        run: |
          set -euo pipefail
          mkdir -p .release-source
          python3 scripts/package_corresponding_source.py \
            --env "$PIO_ENV" \
            --output ".release-source/${SOURCE_ARCHIVE}"

      - name: Upload BizReader LilyGo artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BizReader-LilyGo-RC-${{ env.SHORT_SHA }}
          if-no-files-found: error
          path: |
            .pio/build/lilygo_release_rc/bootloader.bin
            .pio/build/lilygo_release_rc/firmware.bin
            .pio/build/lilygo_release_rc/firmware.elf
            .pio/build/lilygo_release_rc/firmware.map
            .pio/build/lilygo_release_rc/partitions.bin
            LICENSE
            licenses/LilyGo-EPD47-GPL-3.0.txt
            THIRD_PARTY_NOTICES.md
            .release-source/BizReader-LilyGo-RC-${{ env.SHORT_SHA }}-source.tar.gz

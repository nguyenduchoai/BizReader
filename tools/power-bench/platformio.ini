; ---------------------------------------------------------------------------
; power-bench: STANDALONE bench-test firmware for the LilyGo T5 ePaper 4.7"
; S3 v2.4 (ESP32-S3-WROOM-1-N16R8).
;
; This project is fully independent of the main CrossPoint Reader firmware,
; freeink-sdk, and lib/. It links only:
;   - Arduino core (framework = arduino)
;   - the vendor LilyGo-EPD47 panel driver library
;   - Wire (I2C) / SPI (both bundled with the Arduino core)
;
; Purpose: let a human with a bench ammeter (in series with the battery/USB
; rail) measure the current draw of each peripheral, and each deep-sleep
; configuration, IN ISOLATION. See README.md for the full bench procedure.
;
; Two environments, selected by build-time flag -DBENCH_MODE:
;   env:ladder     -> BENCH_MODE=0  (active-state incremental ladder)
;   env:sleeptest  -> BENCH_MODE=1  (deep-sleep config comparison)
; ---------------------------------------------------------------------------

[platformio]
default_envs = ladder

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ESP32-S3-WROOM-1-N16R8: 16MB flash, 8MB octal PSRAM (OPI).
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; REQUIRED: LilyGo-EPD47's rmt_pulse.c checks ESP_IDF_VERSION_MAJOR before
  ; the header that defines it is otherwise pulled in on this IDF/Arduino
  ; core combo, which mis-selects the legacy RMT include path and fails to
  ; build. Pre-including the version header here fixes it without patching
  ; the vendor library.
  -include esp_idf_version.h
  -std=gnu++2a

build_unflags =
  -std=gnu++11

; Vendor LilyGo-EPD47 panel driver library, pinned to the commit verified
; against the v2.4 board during hardware bring-up. No patch/srcFilter script
; is needed here: this project has no PNGdec (or any other zlib consumer), so
; the vendor lib's bundled zlib/libjpeg/font.c/touch.cpp objects are simply
; never referenced and the linker drops them — nothing to collide with.
lib_deps =
  https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#77387e3

[env:ladder]
extends = base
build_flags =
  ${base.build_flags}
  -DBENCH_MODE=0

[env:sleeptest]
extends = base
build_flags =
  ${base.build_flags}
  -DBENCH_MODE=1

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Spreadsheet</title>
<link rel="stylesheet" href="app.css">
<style>
  body { background: #ffffff; }
  #tabs {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 6px;
    padding: 8px;
    background: #eceff1;
    border-bottom: 1px solid #cfd8dc;
  }
  #tabs button {
    flex: 0 0 auto;
    border: 1px solid #b0bec5;
    border-radius: 16px;
    background: #ffffff;
    color: #37474f;
    font-size: 13px;
    padding: 6px 14px;
  }
  #tabs button.active {
    background: #1565c0;
    border-color: #1565c0;
    color: #ffffff;
  }
  #sheet { padding: 8px; overflow: auto; }
  #sheet table { border-collapse: collapse; font-size: 13px; }
  #sheet td, #sheet th {
    border: 1px solid #cfd8dc;
    padding: 4px 8px;
    white-space: pre;
    min-width: 40px;
  }
  #sheet tr:first-child td { background: #f5f7f8; font-weight: 600; }
</style>
<script src="lib/xlsx.full.min.js"></script>
</head>
<body>
<div id="vw-status" class="vw-status">Đang mở bảng tính…</div>
<div id="tabs" style="display:none"></div>
<div id="sheet"></div>
<script src="app.js"></script>
<script>
vwFetchDoc("buffer")
  .then(function (buf) {
    var wb = XLSX.read(new Uint8Array(buf), { type: "array", cellDates: true });
    if (!wb.SheetNames.length) throw new Error("Bảng tính không có trang dữ liệu");
    var tabs = document.getElementById("tabs");
    var sheetDiv = document.getElementById("sheet");
    function show(idx) {
      var ws = wb.Sheets[wb.SheetNames[idx]];
      sheetDiv.innerHTML = XLSX.utils.sheet_to_html(ws, { editable: false });
      var btns = tabs.querySelectorAll("button");
      for (var i = 0; i < btns.length; i++) btns[i].className = i === idx ? "active" : "";
    }
    wb.SheetNames.forEach(function (sn, idx) {
      var b = document.createElement("button");
      b.textContent = sn;
      b.onclick = function () { show(idx); };
      tabs.appendChild(b);
    });
    if (wb.SheetNames.length > 1) tabs.style.display = "";
    show(0);
    vwStatusDone();
  })
  .catch(function (e) { vwError("Không thể mở bảng tính", String(e)); });
</script>
</body>
</html>

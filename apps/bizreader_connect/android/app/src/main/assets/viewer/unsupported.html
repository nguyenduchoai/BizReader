<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Định dạng chưa hỗ trợ</title>
<link rel="stylesheet" href="app.css">
<style>
  .card {
    margin: 32px 16px;
    padding: 20px;
    border-radius: 12px;
    background: #ffffff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    color: #37474f;
  }
  .card h2 { margin: 0 0 8px; font-size: 18px; }
  .card .fname { font-weight: 600; word-break: break-all; }
  .card p { font-size: 14px; line-height: 1.5; }
  .as-text {
    display: block;
    width: 100%;
    margin: 18px 0 8px;
    padding: 12px 16px;
    border: 0;
    border-radius: 8px;
    background: #1565c0;
    color: #ffffff;
    font: 500 15px Roboto, -apple-system, "Segoe UI", sans-serif;
  }
  .as-text:active { background: #0d47a1; }
  .card .caveat { font-size: 13px; opacity: 0.75; }
</style>
</head>
<body>
<div class="card">
  <h2>BizReader chưa nhận dạng định dạng này</h2>
  <p class="fname" id="fname"></p>
  <p id="hint"></p>
  <button type="button" class="as-text" id="asText" aria-describedby="caveat">Thử mở dạng văn bản</button>
  <p class="caveat" id="caveat">Nếu đây không phải tệp văn bản, nội dung có thể bị sai.</p>
</div>
<script src="app.js"></script>
<script>
document.getElementById("fname").textContent = vwName;
var hint = document.getElementById("hint");
if (vwExt === "doc" || vwExt === "ppt") {
  hint.textContent =
    "Đây là định dạng Office cũ (." + vwExt + "). Hãy lưu lại thành ." +
    (vwExt === "doc" ? "docx" : "pptx") + " để BizReader hiển thị.";
} else {
  // Nothing useful to add; leave the card to the action below
  hint.style.display = "none";
}

document.getElementById("asText").addEventListener("click", function () {
  location.replace(
    "text.html?name=" + encodeURIComponent(vwName) + "&ext=" + encodeURIComponent(vwExt)
  );
});
</script>
</body>
</html>
